{{- if include "midstream.controlPlaneEnabled" . }}
apiVersion: kaspr.io/v1alpha1
kind: KasprWebView
metadata:
  name: {{ include "midstream.fullname" . }}-users-invite
  namespace: {{ .Release.Namespace }}
  labels:
    kaspr.io/app: {{ include "midstream.controlPlane" . }}
spec:
  name: users-invite
  description: "Invite people by email: an invited account each, holding the chosen groups; emit the request the identity agent applies, and answer each invitation's link once."
  request:
    method: POST
    path: /users/invitations
  processors:
    pipeline:
      - prepare-request
      - send-identity-request
      - return-response
    operations:
      - name: prepare-request
        tables:
          - name: {{ include "midstream.fullname" . }}-directory
            paramName: directory_table
          - name: {{ include "midstream.fullname" . }}-settings
            paramName: settings_table
        map:
          entrypoint: prepare_request
          python: |
            from midstream.identity.authorization import authorize
            from midstream.web.http import json_body
            from midstream.web.identity import invite_users_request

            async def prepare_request(request, directory_table, settings_table):
                principal = authorize(request, directory_table, "users.invite")
                body = await json_body(request)
                return invite_users_request(
                    directory_table, principal, body, request=request, settings_table=settings_table
                ).to_value()
      - name: send-identity-request
        topicSend:
          name: {{ include "midstream.fullname" . }}-identity-requests
          passThrough: true
          valueSerializer: json
          keySelector:
            python: |
              def select_key(value):
                  from midstream.storage.identity import identity_routing_key

                  return identity_routing_key()
          valueSelector:
            python: |
              def select_value(value):
                  # The request carries each link's hash only; the links stay in the response.
                  return value["request_event"]
      - name: return-response
        map:
          python: |
            def return_response(value):
                return value["response"]
  response:
    contentType: application/json
    statusCodeSelector:
      onSuccess:
        python: |
          def status_code(data):
              return 202
    bodySelector:
      onSuccess:
        python: |
          def body(data):
              return data
{{- end }}
